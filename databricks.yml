bundle:
  name: transitpulse

include:
  - resources/*.yml

# Only the pipeline and API code, and the runbooks the triage step reads, need to reach the workspace.
sync:
  exclude:
    - collector
    - design/adr
    - design/DESIGN.md
    - design/specs
    - infra
    - scripts
    - tests

variables:
  catalog:
    description: Unity Catalog catalog for every table.
    default: workspace
  schema_prefix:
    description: Prefix that keeps each environment's schemas apart.
    default: ""
  landing_root:
    description: Volume path the collector writes to (read-only for the pipeline).
    default: /Volumes/workspace/bronze/landing
  gtfs_files_root:
    description: Volume where each GTFS schedule version is unpacked, one folder per table.
    default: /Volumes/${var.catalog}/${var.schema_prefix}bronze/gtfs_files
  warehouse_id:
    description: SQL warehouse the API queries.
    lookup:
      warehouse: Serverless Starter Warehouse
  app_suffix:
    description: Keeps the dev app's name apart from prod's (app names are workspace-wide).
    default: ""
  triage_model:
    description: Foundation Model endpoint the triage agent uses; empty means rules only.
    default: databricks-meta-llama-3-3-70b-instruct
  realtime_start:
    description: Oldest landed realtime file a new table loads (yyyy-MM-ddTHH:mm:ss, UTC). Empty loads all.
    default: ""
  retention_mode:
    description: report lists what landing retention would delete; delete also deletes it.
    default: report

# The workspace comes from your Databricks CLI profile, so no host is committed here.
targets:
  dev:
    mode: development
    default: true
    variables:
      schema_prefix: dev_
      app_suffix: -dev
      # dev only needs recent bus data, and the daily compute quota is shared with prod.
      realtime_start: "2026-11-13T00:00:00"
      # dev reads the same landing volume as prod, so it must never delete from it.
      retention_mode: report

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      retention_mode: delete
