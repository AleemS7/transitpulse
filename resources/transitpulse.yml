resources:
  pipelines:
    transitpulse:
      name: transitpulse
      catalog: ${var.catalog}
      schema: ${var.schema_prefix}silver
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src
      libraries:
        - glob:
            include: ../src/transitpulse/pipelines/**
      configuration:
        tp_catalog: ${var.catalog}
        tp_bronze: ${var.schema_prefix}bronze
        tp_silver: ${var.schema_prefix}silver
        tp_gold: ${var.schema_prefix}gold
        tp_ops: ${var.schema_prefix}ops
        tp_landing_root: ${var.landing_root}
        tp_gtfs_files_root: ${var.gtfs_files_root}

  jobs:
    transitpulse_refresh:
      name: transitpulse-refresh
      description: Refreshes the medallion pipeline from newly landed files. Paused automatically in dev.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 15 * * * ?"
        timezone_id: UTC
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
      tasks:
        - task_key: extract_gtfs
          environment_key: default
          spark_python_task:
            python_file: ../src/transitpulse/jobs/extract_gtfs.py
            parameters:
              - --src-root
              - ${workspace.file_path}/src
              - --zip-dir
              - ${var.landing_root}/gtfs_static
              - --out-dir
              - ${var.gtfs_files_root}
        - task_key: refresh_pipeline
          depends_on:
            - task_key: extract_gtfs
          pipeline_task:
            pipeline_id: ${resources.pipelines.transitpulse.id}
          max_retries: 1
          min_retry_interval_millis: 300000
