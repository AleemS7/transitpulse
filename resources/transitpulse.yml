resources:
  pipelines:
    transitpulse:
      name: transitpulse
      catalog: ${var.catalog}
      schema: ${var.schema_prefix}silver
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src
      # Published so ops.dq_metrics can read expectation results with plain SQL.
      event_log:
        catalog: ${var.catalog}
        schema: ${var.schema_prefix}ops
        name: pipeline_events
      libraries:
        - glob:
            include: ../src/transitpulse/pipelines/**
      configuration:
        tp_catalog: ${var.catalog}
        tp_bronze: ${var.schema_prefix}bronze
        tp_silver: ${var.schema_prefix}silver
        tp_gold: ${var.schema_prefix}gold
        tp_ops: ${var.schema_prefix}ops
        tp_landing_root: ${var.landing_root}
        tp_gtfs_files_root: ${var.gtfs_files_root}
        tp_realtime_start: ${var.realtime_start}

  jobs:
    transitpulse_refresh:
      name: transitpulse-refresh
      description: Refreshes the medallion pipeline from newly landed files. Paused automatically in dev.
      max_concurrent_runs: 1
      # A failed task is the alert; when a check failed, the triage task's error carries the proposed incident.
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # An hourly refresh takes a few minutes; the headroom is for a first load of the collected history.
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 15 * * * ?"
        timezone_id: UTC
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
      tasks:
        - task_key: extract_gtfs
          environment_key: default
          spark_python_task:
            python_file: ../src/transitpulse/jobs/extract_gtfs.py
            parameters:
              - --src-root
              - ${workspace.file_path}/src
              - --zip-dir
              - ${var.landing_root}/gtfs_static
              - --out-dir
              - ${var.gtfs_files_root}
        - task_key: refresh_pipeline
          depends_on:
            - task_key: extract_gtfs
          pipeline_task:
            pipeline_id: ${resources.pipelines.transitpulse.id}
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: health_checks
          depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          # A failed check is a finding, not a transient error, so serverless shouldn't retry it.
          max_retries: 0
          disable_auto_optimization: true
          spark_python_task:
            python_file: ../src/transitpulse/jobs/health_checks.py
            parameters:
              - --src-root
              - ${workspace.file_path}/src
              - --catalog
              - ${var.catalog}
              - --silver
              - ${var.schema_prefix}silver
              - --ops
              - ${var.schema_prefix}ops
              - --run-id
              - "{{job.run_id}}"
        - task_key: triage
          depends_on:
            - task_key: health_checks
          # Also runs when the refresh or the checks failed; that's when it's needed.
          run_if: ALL_DONE
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          spark_python_task:
            python_file: ../src/transitpulse/jobs/triage.py
            parameters:
              - --src-root
              - ${workspace.file_path}/src
              - --runbooks
              - ${workspace.file_path}/design/runbooks
              - --catalog
              - ${var.catalog}
              - --gold
              - ${var.schema_prefix}gold
              - --ops
              - ${var.schema_prefix}ops
              - --run-id
              - "{{job.run_id}}"
              - --model
              - ${var.triage_model}
              - --app-name
              - ${resources.apps.transitpulse_api.name}
